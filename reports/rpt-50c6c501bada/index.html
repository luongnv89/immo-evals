<!-- ════════════════════ RENDERER (fixed) ════════════════════ -->
<script>
const PALETTE = {
  ink:'#0A0A0A', leaf:'#16A34A', leafdeep:'#15803D', warn:'#D97706', danger:'#DC2626',
  info:'#2563EB', mute:'#6B7280', line:'#E7E5DF', cream:'#FAF9F6', sand:'#F3F1EA'
};
const TONE = {
  good:  { bar:'#16A34A', pill:'leaf',   ring:'#16A34A' },
  warn:  { bar:'#D97706', pill:'warn',   ring:'#D97706' },
  bad:   { bar:'#DC2626', pill:'danger', ring:'#DC2626' },
  neutral:{ bar:'#0A0A0A', pill:'mute',  ring:'#0A0A0A' },
};
// Escape HTML-significant chars: these scalar fields (title, KPI labels, cost
// labels) are interpolated into innerHTML, so a "<" or "&" in scraped data must
// not become live markup. Rich section fragments (s.html) are intentionally NOT
// routed through here — the template trusts those as authored HTML.
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c => (
  {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

const DATA = JSON.parse(document.getElementById('report-data').textContent);

/* ---------- hero ---------- */
(function hero(){
  const d = DATA;
  document.title = (d.title || 'Rapport') + ' — immo·evals';
  document.getElementById('footDate').textContent = d.date || '';
  document.getElementById('heroDate').textContent = d.date || 'Analyse du jour';

  // title — split at em/dash → second half italic green
  const t = esc(d.title);
  const parts = t.split(/\s+[—–-]\s+/);
  document.getElementById('heroTitle').innerHTML = parts.length === 2
    ? `${parts[0]}<br><em class="not-italic font-[600] text-leafdeep" style="font-style:italic;">${parts.slice(1).join(' — ')}</em>`
    : t;

  document.getElementById('heroSummary').textContent = d.summary || '';

  if (d.url){
    const a = document.getElementById('heroUrl'); a.href = d.url;
    a.classList.remove('hidden'); document.getElementById('heroUrlSep').classList.remove('hidden');
  }

  // verdict
  const tone = (d.verdict && d.verdict.tone) || 'neutral';
  const tk = TONE[tone] || TONE.neutral;
  const pill = document.getElementById('verdictPill');
  const dot = document.getElementById('verdictDot');
  document.getElementById('verdictLabel').textContent = (d.verdict && d.verdict.label) || 'Verdict';
  const toneBg = { good:['bg-leafsoft','border-leaf','text-leafdeep'], warn:['bg-warnsoft','border-warn','text-warn'],
    bad:['bg-dangersoft','border-danger','text-danger'], neutral:[] };
  (toneBg[tone]||[]).forEach(c=>pill.classList.add(c));
  dot.style.background = tk.ring;
  dot.style.boxShadow = `0 0 0 3px ${tk.ring}2e`;
  document.getElementById('heroBar').style.background = tk.bar;

  // kpis
  const k = d.kpi || {};
  set('kpiPrice', k.price); set('kpiPriceSub', k.priceSub);
  set('kpiPm2', k.pricem2); set('kpiSurface', k.surface); set('kpiType', k.type);
  if (k.ecart){
    const tt = { up:['text-warn','▲'], down:['text-leafdeep','▼'], flat:['text-mute','▬'] }[k.ecartTone||'flat'];
    document.getElementById('kpiEcart').innerHTML =
      `<span class="font-semibold ${tt[0]}">${tt[1]} ${esc(k.ecart)}</span><span class="text-mute2">${esc(k.ecartLabel||'')}</span>`;
  }
  if (k.dpe){
    const el = document.getElementById('kpiDpe');
    el.textContent = k.dpe; el.className = `inline-grid place-items-center w-9 h-9 rounded-md font-serif font-black text-lg text-paper dpe-${String(k.dpe).toLowerCase()}`;
    set('kpiDpeSub', k.dpeSub);
  }

  // score gauge
  if (d.score && typeof d.score.value === 'number'){
    document.getElementById('scoreVal').textContent = Number(d.score.value).toLocaleString('fr-FR');
    set('scoreNote', d.score.note);
    const v = Math.max(0, Math.min(10, d.score.value));
    const col = v >= 7 ? PALETTE.leaf : v >= 5 ? PALETTE.warn : PALETTE.danger;
    new Chart(document.getElementById('scoreGauge'), {
      type:'doughnut',
      data:{ datasets:[{ data:[v, 10-v], backgroundColor:[col, '#ECEAE2'], borderWidth:0 }] },
      options:{ cutout:'76%', responsive:false, plugins:{ legend:{display:false}, tooltip:{enabled:false} }, animation:{animateRotate:true,duration:900} }
    });
  }

  // reliability flag — surface any listing/source contradiction in the hero,
  // not buried in section 8. A wrong construction date is the headline.
  const rel = d.reliability;
  const mismatches = (rel && Array.isArray(rel.checks) ? rel.checks : []).filter(c => c && c.status === 'mismatch');
  if (mismatches.length){
    const badge = document.createElement('a');
    badge.href = '#fiabilite';
    badge.className = 'inline-flex items-center gap-1.5 px-3 py-1.5 rounded-full bg-dangersoft border border-danger/30 text-[11px] font-bold uppercase tracking-wider text-danger no-underline hover:bg-danger hover:text-paper transition';
    const n = mismatches.length;
    badge.innerHTML = `<span aria-hidden="true">⚠</span> ${n} donnée${n>1?'s':''} à vérifier`;
    const row = document.querySelector('#hero .flex.flex-wrap.items-center');
    if (row) row.appendChild(badge);
  }

  function set(id,val){ const el=document.getElementById(id); if(el && val!=null && val!=='') el.textContent = val; }
})();

/* ---------- photo gallery ---------- */
// Renders data.photos (the listing's HOSTED image URLs — never downloaded) as a
// responsive grid. Security: only http(s) URLs are allowed (reject javascript:/
// data:/etc), and the src is set via a parsed URL, not raw interpolation. Broken
// images hide themselves (onerror) so a dead listing URL leaves no empty box.
(function gallery(){
  const photos = Array.isArray(DATA.photos) ? DATA.photos : [];
  // keep only well-formed http(s) URLs; cap at 12 so a 30-photo listing can't bloat the report
  const safe = [];
  for (const p of photos){
    try { const u = new URL(String(p)); if (u.protocol === 'http:' || u.protocol === 'https:') safe.push(u.href); }
    catch(_){ /* skip malformed */ }
    if (safe.length >= 12) break;
  }
  const host = document.getElementById('gallery');
  if (!host || !safe.length) return;   // no photos → section stays hidden

  host.classList.remove('hidden');
  host.className = 'bg-paper border border-line rounded-2xl shadow-card overflow-hidden mb-5 break-avoid';
  const head = `
    <div class="flex items-center gap-3.5 px-7 pt-6 pb-1">
      <span class="text-[10px] font-bold uppercase tracking-[.18em] text-mute2">Photos de l'annonce</span>
      <span class="text-[11px] text-mute2">· ${safe.length} photo${safe.length>1?'s':''} · source : annonce</span>
    </div>`;
  const grid = document.createElement('div');
  grid.className = 'grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 gap-2 p-5 pt-3';
  safe.forEach((href, i) => {
    const a = document.createElement('a');
    a.href = href; a.target = '_blank'; a.rel = 'noopener noreferrer';
    a.className = 'group relative block aspect-[4/3] overflow-hidden rounded-lg bg-sand border border-line';
    // first photo spans 2×2 on larger screens for a hero-ish layout
    if (i === 0) a.className += ' col-span-2 row-span-2 sm:aspect-auto';
    const img = document.createElement('img');
    img.src = href; img.loading = 'lazy'; img.decoding = 'async';
    img.alt = 'Photo ' + (i+1) + " de l'annonce";
    img.className = 'w-full h-full object-cover transition duration-300 group-hover:scale-[1.03]';
    // a broken/blocked URL removes its tile entirely (no empty grey box)
    img.addEventListener('error', () => { a.remove(); if (!grid.querySelector('img')) host.classList.add('hidden'); });
    a.appendChild(img);
    grid.appendChild(a);
  });
  host.innerHTML = head;
  host.appendChild(grid);

  // Print→PDF: lazy + below-the-fold images often render blank in Chrome's
  // print output. Flip them to eager before printing so the gallery survives
  // "Save as PDF". (Best-effort; CDNs that block file:// hotlinking may still
  // 403 — the onerror handler then drops those tiles cleanly.)
  window.addEventListener('beforeprint', () => {
    grid.querySelectorAll('img[loading="lazy"]').forEach(im => { im.loading = 'eager'; });
  });
})();

/* ---------- shared Chart.js defaults ---------- */
Chart.defaults.font.family = "'Inter Tight', system-ui, sans-serif";
Chart.defaults.font.size = 12;
Chart.defaults.color = '#6B7280';

/* ---------- sections ---------- */
(function sections(){
  const body = document.getElementById('reportBody');
  const toc = document.getElementById('tocNav');
  const charts = DATA.charts || {};

  (DATA.sections || []).forEach((s, i) => {
    const sec = document.createElement('section');
    sec.id = s.id || ('section-'+i);
    sec.className = 'acc bg-paper border border-line rounded-xl shadow-soft mb-[18px] overflow-hidden break-avoid';

    const num = s.num || String(i+1).padStart(2,'0');
    sec.innerHTML = `
      <div class="acc-head flex items-center gap-3.5 px-7 py-5 cursor-pointer select-none hover:bg-ink/[.015] transition" role="button" tabindex="0" aria-expanded="true" aria-controls="${sec.id}-body">
        <span class="inline-grid place-items-center w-8 h-8 bg-ink text-paper font-mono text-xs font-semibold rounded-lg shrink-0">${num}</span>
        <span class="flex-1 font-serif font-bold text-[1.35rem] tracking-tight text-ink leading-tight" style="font-variation-settings:'opsz' 36;">${esc(s.title)}</span>
        <span class="acc-caret font-mono text-xs text-mute2" aria-hidden="true">▾</span>
      </div>
      <div class="acc-body border-t border-transparent" id="${sec.id}-body"><div><div class="px-7 pt-5 pb-7">
        ${s.chart ? `<div class="chart-slot mb-5"></div>` : ''}
        <div class="prose-rt">${s.html || ''}</div>
      </div></div></div>`;

    body.appendChild(sec);

    // chart for this section
    if (s.chart){
      const slot = sec.querySelector('.chart-slot');
      buildChart(s.chart, slot, charts);
    }

    // toc entry
    const a = document.createElement('a');
    a.href = '#'+sec.id;
    a.className = 'flex items-baseline gap-2.5 px-3.5 py-2 text-[13px] font-medium text-mute no-underline border-l-2 border-line hover:text-ink hover:border-ink hover:bg-ink/[.02] transition';
    a.innerHTML = `<span class="font-mono text-[10px] font-semibold text-mute2 shrink-0">${num}</span><span>${esc(s.title)}</span>`;
    a.addEventListener('click', e=>{ e.preventDefault();
      sec.classList.remove('collapsed');
      setTimeout(()=>window.scrollTo({top: sec.getBoundingClientRect().top+scrollY-68, behavior:'smooth'}), 60);
    });
    toc.appendChild(a);

    // collapse toggle — mouse + keyboard (Enter / Space), with aria-expanded sync
    const head = sec.querySelector('.acc-head');
    const toggle = ()=>{ const collapsed = sec.classList.toggle('collapsed');
      head.setAttribute('aria-expanded', String(!collapsed)); };
    head.addEventListener('click', toggle);
    head.addEventListener('keydown', e=>{ if(e.key==='Enter' || e.key===' '){ e.preventDefault(); toggle(); } });
  });

  // ---------- Fiabilité de l'annonce (listing claim verification) ----------
  // Template-owned, structured render (NOT a trusted s.html fragment): every
  // scraped/verified scalar goes through esc(). Four states, each with its own
  // color + glyph so an honest verdict is structural, not trust-the-agent.
  buildReliability(DATA.reliability, body, toc);

  const setAll = (collapsed)=> document.querySelectorAll('.acc').forEach(s=>{
    s.classList.toggle('collapsed', collapsed);
    const h = s.querySelector('.acc-head'); if(h) h.setAttribute('aria-expanded', String(!collapsed));
  });
  document.getElementById('btnExpand').onclick = ()=> setAll(false);
  document.getElementById('btnCollapse').onclick = ()=> setAll(true);

  // scroll-spy
  if ('IntersectionObserver' in window){
    const links = [...toc.querySelectorAll('a')];
    const obs = new IntersectionObserver(es=>{ es.forEach(e=>{ if(e.isIntersecting){
      links.forEach(l=>l.classList.remove('text-ink','border-leaf','font-semibold'));
      const l = toc.querySelector(`a[href="#${e.target.id}"]`);
      if(l) l.classList.add('text-ink','border-leaf','font-semibold');
    }});}, { rootMargin:'-80px 0px -55% 0px' });
    document.querySelectorAll('#reportBody > section').forEach(s=>obs.observe(s));
  }
})();

/* ---------- Fiabilité de l'annonce (listing claim verification) ---------- */
// Renders the optional `reliability` block as a first-class accordion section
// (same shell as data sections) with a per-claim verdict table. Four honest
// states — never a bare ✓: a checkmark only means "confirmed against a source".
// Omits itself entirely if there is no reliability data (graceful degradation,
// mirroring how charts drop out when their data is missing).
function buildReliability(rel, body, toc){
  if (!rel || !Array.isArray(rel.checks) || !rel.checks.length) return;

  // status vocabulary — glyph + colors. `confirmed` is the ONLY green ✓ and is
  // reserved for "source agrees + high-confidence match"; a fuzzy match is at
  // most `consistent`. `mismatch` is the source actively contradicting the
  // listing (the wrong-construction-date case).
  const ST = {
    confirmed:  { glyph:'✓', label:'Confirmé',      cls:'bg-leafsoft text-leafdeep border-leaf/30',     dot:'#16A34A' },
    consistent: { glyph:'≈', label:'Cohérent',      cls:'bg-infosoft text-info border-info/30',         dot:'#2563EB' },
    unverified: { glyph:'?', label:'Non vérifiable', cls:'bg-sand text-mute border-line2',               dot:'#9CA3AF' },
    mismatch:   { glyph:'✗', label:'Incohérent',    cls:'bg-dangersoft text-danger border-danger/30',   dot:'#DC2626' },
  };
  const SCORE = {
    'élevée':  { cls:'text-leafdeep', label:'Fiabilité élevée' },
    'moyenne': { cls:'text-warn',     label:'Fiabilité moyenne' },
    'faible':  { cls:'text-danger',   label:'Fiabilité faible' },
  };

  const hasProvenance = (DATA.sections || []).some(s => s && s.id === 'provenance');
  const num = rel.num || (hasProvenance ? '10' : '08');
  const sec = document.createElement('section');
  sec.id = 'fiabilite';
  sec.className = 'acc bg-paper border border-line rounded-xl shadow-soft mb-[18px] overflow-hidden break-avoid';

  // count by status for the header summary chips
  const counts = rel.checks.reduce((m,c)=>{ const k=(c&&c.status)||'unverified'; m[k]=(m[k]||0)+1; return m; }, {});
  const sc = SCORE[rel.score] || null;

  const rows = rel.checks.map(c => {
    const st = ST[(c && c.status)] || ST.unverified;
    return `<tr>
      <td class="align-top"><span class="font-semibold text-ink">${esc(c.claim)}</span>${c.note ? `<span class="block text-[12px] text-mute mt-0.5">${esc(c.note)}</span>` : ''}</td>
      <td class="align-top tabular-nums">${esc(c.listingValue)}</td>
      <td class="align-top tabular-nums">${c.verified ? esc(c.verified) : '<span class="text-mute2">—</span>'}${c.source ? `<span class="block text-[11px] text-mute2 mt-0.5">${esc(c.source)}</span>` : ''}</td>
      <td class="align-top"><span class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full border text-[11px] font-bold ${st.cls}"><span aria-hidden="true">${st.glyph}</span>${st.label}</span></td>
    </tr>`;
  }).join('');

  sec.innerHTML = `
    <div class="acc-head flex items-center gap-3.5 px-7 py-5 cursor-pointer select-none hover:bg-ink/[.015] transition" role="button" tabindex="0" aria-expanded="true" aria-controls="fiabilite-body">
      <span class="inline-grid place-items-center w-8 h-8 bg-ink text-paper font-mono text-xs font-semibold rounded-lg shrink-0">${esc(num)}</span>
      <span class="flex-1 font-serif font-bold text-[1.35rem] tracking-tight text-ink leading-tight" style="font-variation-settings:'opsz' 36;">Fiabilité de l'annonce</span>
      ${sc ? `<span class="hidden sm:inline text-[12px] font-bold ${sc.cls}">${sc.label}</span>` : ''}
      <span class="acc-caret font-mono text-xs text-mute2" aria-hidden="true">▾</span>
    </div>
    <div class="acc-body border-t border-transparent" id="fiabilite-body"><div><div class="px-7 pt-5 pb-7">
      ${rel.summary ? `<p class="text-[14px] leading-relaxed text-body mb-4 max-w-[72ch]">${esc(rel.summary)}</p>` : ''}
      <div class="prose-rt">
        <table>
          <thead><tr><th>Donnée annoncée</th><th>Valeur annonce</th><th>Vérification (source)</th><th>Verdict</th></tr></thead>
          <tbody>${rows}</tbody>
        </table>
      </div>
      <p class="text-[11px] text-mute2 mt-3 leading-relaxed">Les vérifications « ${ST.confirmed.label} » sont recoupées avec une source officielle ; « ${ST.consistent.label} » indique une estimation plausible non confirmée (ex. distance à vol d'oiseau) ; « ${ST.unverified.label} », aucune source trouvée. Aucune donnée n'est inventée.</p>
    </div></div></div>`;

  body.appendChild(sec);

  // toc entry (mirrors the data-section TOC styling)
  const a = document.createElement('a');
  a.href = '#fiabilite';
  a.className = 'flex items-baseline gap-2.5 px-3.5 py-2 text-[13px] font-medium text-mute no-underline border-l-2 border-line hover:text-ink hover:border-ink hover:bg-ink/[.02] transition';
  a.innerHTML = `<span class="font-mono text-[10px] font-semibold text-mute2 shrink-0">${esc(num)}</span><span>Fiabilité de l'annonce</span>`;
  a.addEventListener('click', e=>{ e.preventDefault();
    sec.classList.remove('collapsed');
    setTimeout(()=>window.scrollTo({top: sec.getBoundingClientRect().top+scrollY-68, behavior:'smooth'}), 60);
  });
  toc.appendChild(a);

  // collapse toggle — mouse + keyboard, aria-expanded sync (same as data sections)
  const head = sec.querySelector('.acc-head');
  const toggle = ()=>{ const collapsed = sec.classList.toggle('collapsed');
    head.setAttribute('aria-expanded', String(!collapsed)); };
  head.addEventListener('click', toggle);
  head.addEventListener('keydown', e=>{ if(e.key==='Enter' || e.key===' '){ e.preventDefault(); toggle(); } });
}

/* ---------- chart builders ---------- */
function buildChart(kind, slot, charts){
  const mk = (h=300)=>{ const wrap=document.createElement('div');
    wrap.className='bg-cream border border-line rounded-xl p-5'; wrap.style.height=h+'px';
    const c=document.createElement('canvas'); wrap.appendChild(c); slot.appendChild(wrap); return c; };
  const cap = (txt)=>{ const p=document.createElement('p'); p.className='text-[11px] text-mute2 mt-2 text-center font-medium'; p.textContent=txt; slot.appendChild(p); };

  try {
    if (kind==='price'){
      const grid = document.createElement('div'); grid.className='grid grid-cols-1 lg:grid-cols-2 gap-4'; slot.appendChild(grid);
      // positioning bars
      const pb = charts.priceBars;
      if (pb){
        const w=document.createElement('div'); w.className='bg-cream border border-line rounded-xl p-5'; w.style.height='280px';
        const c=document.createElement('canvas'); w.appendChild(c); grid.appendChild(w);
        const cols = pb.labels.map((_,i)=> i===0 ? PALETTE.ink : '#C9C6BC');
        new Chart(c,{ type:'bar', data:{ labels:pb.labels, datasets:[{ data:pb.values, backgroundColor:cols, borderRadius:6, barPercentage:.62 }] },
          options:{ responsive:true, maintainAspectRatio:false, plugins:{ legend:{display:false},
            title:{display:true,text:'Positionnement — prix au m²',color:PALETTE.ink,font:{size:13,weight:'600',family:'Fraunces'}},
            tooltip:{callbacks:{label:x=>` ${x.raw.toLocaleString('fr-FR')} ${pb.unit||''}`}} },
            scales:{ y:{beginAtZero:true,grid:{color:'#ECEAE2'},ticks:{callback:v=>v.toLocaleString('fr-FR')}}, x:{grid:{display:false}} } } });
      }
      // trend line
      const pt = charts.priceTrend;
      if (pt){
        const w=document.createElement('div'); w.className='bg-cream border border-line rounded-xl p-5'; w.style.height='280px';
        const c=document.createElement('canvas'); w.appendChild(c); grid.appendChild(w);
        const ctx=c.getContext('2d'); const g=ctx.createLinearGradient(0,0,0,240);
        g.addColorStop(0,'rgba(22,163,74,.22)'); g.addColorStop(1,'rgba(22,163,74,0)');
        new Chart(c,{ type:'line', data:{ labels:pt.years, datasets:[{ data:pt.values, borderColor:PALETTE.leaf, backgroundColor:g,
          fill:true, tension:.35, borderWidth:2.5, pointRadius:3, pointBackgroundColor:PALETTE.leaf, pointBorderColor:'#fff', pointBorderWidth:1.5 }] },
          options:{ responsive:true, maintainAspectRatio:false, plugins:{ legend:{display:false},
            title:{display:true,text:`Évolution prix/m² — ${pt.commune||''}`,color:PALETTE.ink,font:{size:13,weight:'600',family:'Fraunces'}},
            tooltip:{callbacks:{label:x=>` ${x.raw.toLocaleString('fr-FR')} ${pt.unit||''}`}} },
            scales:{ y:{grid:{color:'#ECEAE2'},ticks:{callback:v=>v.toLocaleString('fr-FR')}}, x:{grid:{display:false}} } } });
      }
    }
    else if (kind==='commune'){
      const r = charts.communeRadar; if(!r) return;
      const c = mk(340);
      new Chart(c,{ type:'radar', data:{ labels:r.axes, datasets:[{ data:r.values, label:'Score /10',
        backgroundColor:'rgba(22,163,74,.14)', borderColor:PALETTE.leaf, borderWidth:2,
        pointBackgroundColor:PALETTE.leaf, pointBorderColor:'#fff', pointRadius:3.5 }] },
        options:{ responsive:true, maintainAspectRatio:false, plugins:{ legend:{display:false},
          title:{display:true,text:'Qualité de vie — profil de la commune',color:PALETTE.ink,font:{size:13,weight:'600',family:'Fraunces'}} },
          scales:{ r:{ min:0, max:10, ticks:{stepSize:2,backdropColor:'transparent',color:'#9CA3AF',font:{size:10}},
            grid:{color:'#E2E0D8'}, angleLines:{color:'#E2E0D8'}, pointLabels:{color:'#1F2937',font:{size:12,weight:'500'}} } } } });
    }
    else if (kind==='risk'){
      const rm = charts.riskMatrix; if(!rm || !rm.length) return;
      const sevColor = { eleve:PALETTE.danger, 'élevé':PALETTE.danger, fort:PALETTE.danger,
        moyen:PALETTE.warn, faible:PALETTE.leaf };
      const c = mk(360);
      const pts = rm.map(r=>({ x:r.likelihood, y:r.impact, label:r.label,
        bg:(sevColor[(r.severity||'').toLowerCase()]||PALETTE.mute) }));
      new Chart(c,{ type:'scatter', data:{ datasets:[{ data:pts, pointRadius:11, pointHoverRadius:13,
        backgroundColor:pts.map(p=>p.bg+'cc'), borderColor:pts.map(p=>p.bg), borderWidth:2 }] },
        options:{ responsive:true, maintainAspectRatio:false,
          layout:{padding:6},
          plugins:{ legend:{display:false},
            title:{display:true,text:'Matrice des risques — probabilité × impact',color:PALETTE.ink,font:{size:13,weight:'600',family:'Fraunces'}},
            tooltip:{callbacks:{label:x=>` ${x.raw.label}`}},
            datalabels:false },
          scales:{ x:{min:0,max:1,title:{display:true,text:'Probabilité →',color:'#6B7280',font:{size:11}},grid:{color:'#ECEAE2'},ticks:{display:false}},
                   y:{min:0,max:1,title:{display:true,text:'Impact →',color:'#6B7280',font:{size:11}},grid:{color:'#ECEAE2'},ticks:{display:false}} } },
        plugins:[{ id:'risklabels', afterDatasetsDraw(ch){ const {ctx}=ch; ctx.save();
          ctx.font='600 10px "Inter Tight"'; ctx.fillStyle='#0A0A0A'; ctx.textAlign='center';
          ch.getDatasetMeta(0).data.forEach((pt,idx)=>{ ctx.fillText(pts[idx].label, pt.x, pt.y-16); }); ctx.restore(); } }] });
      // legend
      const lg=document.createElement('div'); lg.className='flex flex-wrap gap-3 justify-center mt-3 text-[11px] font-medium';
      lg.innerHTML = `<span class="inline-flex items-center gap-1.5"><span class="w-2.5 h-2.5 rounded-full" style="background:${PALETTE.danger}"></span>Élevé</span>
        <span class="inline-flex items-center gap-1.5"><span class="w-2.5 h-2.5 rounded-full" style="background:${PALETTE.warn}"></span>Moyen</span>
        <span class="inline-flex items-center gap-1.5"><span class="w-2.5 h-2.5 rounded-full" style="background:${PALETTE.leaf}"></span>Faible</span>`;
      slot.appendChild(lg);
    }
    else if (kind==='cost'){
      const cb = charts.costBreakdown; if(!cb) return;
      const grid=document.createElement('div'); grid.className='grid grid-cols-1 sm:grid-cols-[1fr_auto] gap-5 items-center bg-cream border border-line rounded-xl p-5'; slot.appendChild(grid);
      const cw=document.createElement('div'); cw.style.height='240px'; const c=document.createElement('canvas'); cw.appendChild(c); grid.appendChild(cw);
      const cols=[PALETTE.ink,PALETTE.leaf,PALETTE.warn,PALETTE.info,PALETTE.mute];
      const idx = cb.values.map((v,i)=>i).filter(i=>cb.values[i]>0);
      new Chart(c,{ type:'doughnut', data:{ labels:idx.map(i=>cb.labels[i]),
        datasets:[{ data:idx.map(i=>cb.values[i]), backgroundColor:idx.map((_,j)=>cols[j%cols.length]), borderColor:'#FAF9F6', borderWidth:2 }] },
        options:{ responsive:true, maintainAspectRatio:false, cutout:'58%', plugins:{ legend:{display:false},
          title:{display:true,text:"Coût total d'acquisition",color:PALETTE.ink,font:{size:13,weight:'600',family:'Fraunces'}},
          tooltip:{callbacks:{label:x=>` ${x.label}: ${x.raw.toLocaleString('fr-FR')} €`}} } } });
      // custom legend w/ values
      const lg=document.createElement('div'); lg.className='flex flex-col gap-2 text-[12.5px] min-w-[180px]';
      idx.forEach((i,j)=>{ const row=document.createElement('div'); row.className='flex items-center justify-between gap-3';
        row.innerHTML=`<span class="flex items-center gap-2"><span class="w-2.5 h-2.5 rounded-sm" style="background:${cols[j%cols.length]}"></span>${esc(cb.labels[i])}</span><span class="font-mono text-[11.5px] text-ink tabular-nums">${cb.values[i].toLocaleString('fr-FR')} €</span>`;
        lg.appendChild(row); });
      if(cb.total){ const tot=document.createElement('div'); tot.className='flex items-center justify-between gap-3 border-t border-line2 pt-2 mt-1 font-semibold';
        tot.innerHTML=`<span class="text-ink">Total</span><span class="font-mono text-ink tabular-nums">${esc(cb.total)}</span>`; lg.appendChild(tot); }
      grid.appendChild(lg);
    }
  } catch(err){
    slot.innerHTML = `<div class="bg-warnsoft border border-warn/30 rounded-xl p-4 text-[13px] text-warn">Graphique indisponible (données incomplètes).</div>`;
    console.error('chart error', kind, err);
  }
}
</script>
